server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        
        - id: crud-service-users
          uri: lb://crud-service
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationGatewayFilter
        
        - id: crud-service-chatrooms
          uri: lb://crud-service
          predicates:
            - Path=/api/chatrooms/**
          filters:
            - AuthenticationGatewayFilter
        
        # 消息服务路由
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/messages/**
          filters:
            - AuthenticationGatewayFilter
        
        # WebSocket网关路由
        - id: websocket-gateway
          uri: lb:ws://websocket-gateway
          predicates:
            - Path=/ws/**
          filters:
            - AuthenticationGatewayFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 30
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:api-gateway}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        failureRateThreshold: 60
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 20s
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
  retry:
    instances:
      auth-service:
        maxAttempts: 2
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      auth-service:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
    circuitbreakers:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix.eureka: INFO

chatroomApp:
  BLACKLIST_PREFIX: "token:blacklist:"
  JWT_TOKEN_COOKIE_NAME: JWT-Token
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  request:

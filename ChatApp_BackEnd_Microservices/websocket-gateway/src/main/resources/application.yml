spring:
  application:
    name: websocket-gateway
    
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
      
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
            logger-level: basic
          auth-service:
            connect-timeout: 3000
            read-timeout: 5000
          crud-service:
            connect-timeout: 3000
            read-timeout: 5000
          message-service:
            connect-timeout: 5000
            read-timeout: 10000
      httpclient:
        enabled: true

server:
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: /

websocket:
  chat:
    endpoint: /ws/chatroom/{chatroomId}/user/{userId}
    allowed-origins: ${FRONT_URL:http://localhost:4200}
    session-expiry: 86400  # 24 hours in seconds
    redis:
      chatroom-channel: channel:chatroom:%d
      chatroom-users-key: chatroom:%d:user:%d
  message:
    MAX_RETRY_ATTEMPTS: 3
    INITIAL_RETRY_DELAY_MS: 1000
    RETRY_BACKOFF_MULTIPLIER: 2.0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:websocket-gateway}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    com.devStudy.chatapp.websocket: INFO
    org.springframework.web.socket: INFO
    org.springframework.cloud.openfeign: DEBUG
    redis: INFO
    rabbitmq: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

resilience4j:
  circuitbreaker:
    instances:
      message-service:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
  retry:
    instances:
      message-service:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException.InternalServerError
          - feign.FeignException.ServiceUnavailable
          - java.net.ConnectException
          - java.net.SocketTimeoutException
  timelimiter:
    instances:
      message-service:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  endpoint:
    health:
      show-details: when-authorized
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
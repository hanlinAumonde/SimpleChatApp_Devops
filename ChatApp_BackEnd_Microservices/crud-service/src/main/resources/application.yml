server:
  port: 8083

spring:
  application:
    name: crud-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chatAppDB
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:crud-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.50,0.95,0.99
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
    baggage:
      correlation:
        enabled: true
      remote-fields: user-id,session-id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

chatroomApp:
  rabbitmq:
    RABBITMQ_EXCHANGE_NAME: chatroom-event-exchange
    CHATROOM_MEMBER_CHANGE_ROUTING_KEY: chatroom.member.change
    CHATROOM_REMOVE_ROUTING_KEY: chatroom.remove
  pageable:
    DefaultPageSize_Chatrooms: 5
    DefaultPageSize_Users: 5
name: ChatApp-Microservices

networks:
  chatapp-network:
    driver: bridge
  middleware-network:
    driver: bridge
  monitoring-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

services:
  # ==================== Infrastructure ====================
  
  # PostgreSQL
  postgres:
    image: postgres:latest
    container_name: chatapp-postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chatAppDB
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./SQL-Scripts:/docker-entrypoint-initdb.d
    networks:
      - middleware-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chatAppDB"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MongoDB
  mongodb:
    image: mongo:latest
    command: ["--wiredTigerCacheSizeGB", "0.26"]
    hostname: mongodb
    container_name: chatapp-mongodb
    volumes:
      - ./mongodb-data:/data/db
    networks:
      - middleware-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis
  redis:
    image: redis:latest
    container_name: chatapp-redis
    hostname: redis
    networks:
      - middleware-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:latest
    container_name: chatapp-rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
#    ports:
#      - "15672:15672"
    networks:
      - middleware-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Service Registry ====================
  
  # Eureka server
  eureka-server:
    build: ./ChatApp_BackEnd_Microservices/eureka-server
    container_name: chatapp-eureka
    hostname: eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    volumes:
      - ./logs/eureka-server:/app/logs
    ports:
      - "8761:8761"
    networks:
      - chatapp-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Microservices ====================
  
  # Auth service
  auth-service:
    build: ./ChatApp_BackEnd_Microservices/auth-service
    container_name: chatapp-auth-service
    hostname: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - TRACING_PROBABILITY=${TRACING_PROBABILITY:-1.0}
      - HOSTNAME=auth-service
    volumes:
      - ./logs/auth-service:/app/logs
    networks:
      - chatapp-network
      - middleware-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API gateway
  api-gateway:
    build: ./ChatApp_BackEnd_Microservices/api-gateway
    container_name: chatapp-api-gateway
    hostname: api-gateway
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - TRACING_PROBABILITY=${TRACING_PROBABILITY:-1.0}
      - HOSTNAME=api-gateway
    volumes:
      - ./logs/api-gateway:/app/logs
    networks:
      - chatapp-network
      - middleware-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CRUD service
  crud-service:
    build: ./ChatApp_BackEnd_Microservices/crud-service
    container_name: chatapp-crud-service
    hostname: crud-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - TRACING_PROBABILITY=${TRACING_PROBABILITY:-1.0}
      - HOSTNAME=crud-service
    volumes:
      - ./logs/crud-service:/app/logs
    networks:
      - chatapp-network
      - middleware-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Message service
  message-service:
    build: ./ChatApp_BackEnd_Microservices/message-service
    container_name: chatapp-message-service
    hostname: message-service
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DBNAME=${MONGO_DBNAME:-ChatApp}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - TRACING_PROBABILITY=${TRACING_PROBABILITY:-1.0}
      - HOSTNAME=message-service
    volumes:
      - ./logs/message-service:/app/logs
    networks:
      - chatapp-network
      - middleware-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket service
  websocket-gateway:
    build: ./ChatApp_BackEnd_Microservices/websocket-gateway
    container_name: chatapp-websocket-gateway
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - TRACING_PROBABILITY=${TRACING_PROBABILITY:-1.0}
      - FRONT_URL=${FRONT_URL:-http://localhost:4200}
      - HOSTNAME=websocket-gateway
    volumes:
      - ./logs/websocket-gateway:/app/logs
    networks:
      - chatapp-network
      - middleware-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Monitoring Services ====================
  
  # Zipkin tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: chatapp-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: chatapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-network
      - chatapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana visualization
  grafana:
    image: grafana/grafana:latest
    container_name: chatapp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3


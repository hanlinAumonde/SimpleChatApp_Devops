  # ==================== 前端应用 ====================

  # Angular前端
  frontend:
    build: ./ChatApp_FrontEnd
    container_name: chatapp-frontend
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    volumes:
      - ./ChatApp_FrontEnd/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - chatapp-network
    restart: unless-stopped